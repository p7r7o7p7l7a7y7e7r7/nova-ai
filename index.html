<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nova AI</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #09070f 0%, #110b22 50%, #050b14 100%);
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .app-container {
            width: 100%;
            max-width: 600px;
            background: rgba(255, 255, 255, 0.02);
            border: 2px solid rgba(127, 0, 255, 0.2);
            border-radius: 24px;
            padding: 30px;
            backdrop-filter: blur(20px);
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5), 0 0 30px rgba(127, 0, 255, 0.1);
            display: flex;
            flex-direction: column;
            gap: 25px;
        }

        .branding {
            text-align: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            padding-bottom: 20px;
        }

        .title {
            font-size: 2.5rem;
            font-weight: 800;
            background: linear-gradient(90deg, #ff007f, #7f00ff, #00f2fe);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: 2px;
            margin-bottom: 5px;
            text-transform: uppercase;
        }

        .tagline {
            font-size: 1rem;
            color: #a0a0b8;
            letter-spacing: 1px;
        }

        .box-label {
            font-size: 0.9rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #00f2fe;
            margin-bottom: 8px;
            display: block;
        }

        .question-section, .answer-section {
            display: flex;
            flex-direction: column;
        }

        .input-group {
            display: flex;
            gap: 12px;
        }

        input {
            flex: 1;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 16px;
            border-radius: 14px;
            color: white;
            font-size: 1rem;
            outline: none;
            transition: 0.3s;
        }

        input:focus {
            border-color: #7f00ff;
            box-shadow: 0 0 15px rgba(127, 0, 255, 0.3);
        }

        button {
            background: linear-gradient(135deg, #ff007f, #7f00ff);
            color: white;
            border: none;
            padding: 0 25px;
            border-radius: 14px;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
            transition: 0.2s;
            box-shadow: 0 4px 15px rgba(255, 0, 127, 0.3);
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(255, 0, 127, 0.5);
        }

        button:active {
            transform: translateY(0);
        }

        .answer-box {
            min-height: 150px;
            max-height: 300px;
            background: rgba(0, 0, 0, 0.25);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 16px;
            padding: 20px;
            overflow-y: auto;
            font-size: 1.05rem;
            line-height: 1.6;
            color: #e2e2e9;
        }

        .answer-box::-webkit-scrollbar {
            width: 6px;
        }
        .answer-box::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
        }
        
        .loading-text {
            color: #ff007f;
            font-style: italic;
            animation: pulse 1.5s infinite;
        }
        
        @keyframes pulse {
            0% { opacity: 0.6; }
            50% { opacity: 1; }
            100% { opacity: 0.6; }
        }
    </style>
</head>
<body>

    <div class="app-container">
        <div class="branding">
            <h1 class="title">Nova AI</h1>
            <p class="tagline">Your personal chatbot</p>
        </div>

        <div class="question-section">
            <label class="box-label" for="userInput">Ask a Question</label>
            <div class="input-group">
                <input type="text" id="userInput" placeholder="Type your question here..." autocomplete="off">
                <button onclick="askNova()">Ask Nova</button>
            </div>
        </div>

        <div class="answer-section">
            <label class="box-label">Nova's Answer</label>
            <div class="answer-box" id="answerBox">
                Waiting for a question... Nova AI is ready! 🚀
            </div>
        </div>
    </div>

    <script>
        // 🔑 POP YOUR KEY HERE (Older AIzaSy key is highly recommended!)
        const API_KEY = "AQ.Ab8RN6IBsO2kgg355QARtA2N-PEmqEpJpHBu1dlCvh5meaY1rA"; 
        
        // 🌐 Using a free public proxy server to route past browser blocks
        const PROXY_URL = "https://corsproxy.io?";
        const BASE_URL = `https://googleapis.com{API_KEY}`;
        const FULL_API_URL = PROXY_URL + encodeURIComponent(BASE_URL);

        const userInput = document.getElementById('userInput');
        const answerBox = document.getElementById('answerBox');

        userInput.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') askNova();
        });

        async function askNova() {
            const query = userInput.value.trim();
            if (!query) return;

            answerBox.innerHTML = '<span class="loading-text">Nova is thinking deeply... 🤔</span>';
            userInput.value = '';

            try {
                const response = await fetch(FULL_API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{ parts: [{ text: query }] }],
                        systemInstruction: {
                            parts: [{
                                text: "Your name is Nova AI. You are a highly advanced independent chatbot application developed by a talented 13-year-old creator. You have absolutely no connection to Gemini, Google, or external brands. If users ask about your origins, model, or who made you, proudly assert that you are Nova AI, running on custom developer code. Never break character."
                            }]
                        }
                    })
                });

                const data = await response.json();

                if (data.error) {
                    answerBox.innerText = `Nova Core Error: ${data.error.message}`;
                    return;
                }

                if (data.candidates && data.candidates[0] && data.candidates[0].content && data.candidates[0].content.parts && data.candidates[0].content.parts[0]) {
                    answerBox.innerText = data.candidates[0].content.parts[0].text;
                } else if (data.candidates && data.candidates.content && data.candidates.content.parts && data.candidates.content.parts.text) {
                    answerBox.innerText = data.candidates.content.parts.text;
                } else {
                    answerBox.innerText = "Nova received your message but the network package structure was unexpected.";
                }

            } catch (error) {
                answerBox.innerText = "Error: Nova could not bridge the proxy firewall. Check your API string.";
                console.error(error);
            }
        }
    </script>
</body>
</html>
